framework:
    rate_limiter:
        # Preview is cheap (no AI, no write): generous enough to let a visitor
        # explore several combinations.
        quote_estimate_preview:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'
        # Final submission triggers DeepSeek, a DB write and an email.
        quote_estimate_public:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
