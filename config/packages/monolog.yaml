monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Pas de fingers_crossed : il ne vide son tampon que sur une erreur,
            # et un warning isole serait perdu. C'est precisement ce qui a cache
            # pendant des jours un « Brevo notification skipped » sur la cle API.
            # Pas de php://stderr non plus : sur un mutualise il n'est pas lisible.
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: warning
                max_files: 14
                channels: ["!event", "!deprecation"]
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/deprecation.log"
                level: warning
                max_files: 3
                channels: [deprecation]
